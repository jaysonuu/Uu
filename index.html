<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Restaurant P&amp;L</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#c8281e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Restaurant P&amp;L"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef2f0;--card:#fff;--tx:#18221e;--mu:#68756f;--ac:#c8281e;--ac2:#fff;--bd:#d9e0dc;--ok:#1f7a4d;--bad:#b3392b;--warn:#a8700f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#111815;--card:#1a231f;--tx:#e8efeb;--mu:#93a29a;--ac:#5fc4a0;--ac2:#0d1a14;--bd:#2c3a34;--ok:#5fd08e;--bad:#f08577;--warn:#e3b04f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Zen Kaku Gothic New",system-ui,sans-serif}
header{padding:14px 14px 6px;display:flex;justify-content:space-between;align-items:center;gap:8px}h1{font-size:19px;margin:0;font-weight:700}
nav{display:flex;gap:6px;overflow-x:auto;padding:6px 14px 10px;position:sticky;top:0;background:var(--bg);z-index:5}
nav button{white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:6px 12px;font:inherit;font-size:13px}
nav button.on{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
main{padding:0 14px 40px;max-width:980px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin:0 0 12px}
h2{font-size:16px;margin:4px 0 10px}.mu{color:var(--mu);font-size:13px}
.kp{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}@media(min-width:700px){.kp{grid-template-columns:repeat(4,1fr)}}
.k{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px}.k b{display:block;font-size:21px}.k span{font-size:12px;color:var(--mu)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:500}
td.n,th.n{text-align:right}tr.t td{font-weight:700}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:8px 0}label{font-size:12px;color:var(--mu);display:block}
input,select,textarea{width:100%;font:inherit;padding:7px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);margin-top:2px}
button.p,.card>button{background:var(--ac);color:var(--ac2);border:0;border-radius:6px;padding:8px 14px;font:inherit;font-weight:500}
button.x{background:none;border:0;color:var(--mu)}pre{white-space:pre-wrap;font:inherit;margin:0}
.tag{font-size:11px;border:1px solid var(--ok);color:var(--ok);border-radius:10px;padding:0 6px}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script></head><body>
<header><h1 id="ttl">Restaurant P&amp;L Manager</h1><div style="display:flex;gap:6px"><button id="lg" class="p" style="padding:6px 10px">中文</button><select id="mo" style="width:auto"></select></div></header>
<nav id="nav"></nav><main id="app"></main>
<script>
const K='rpl1';let S,T='dash',M,RT='m',SM='net',Q={},DB=null,saveT,L='en';try{L=localStorage.getItem('rpl_lang')||'en'}catch(e){}
const pad=n=>String(n).padStart(2,'0');
const now=new Date(Date.now()-new Date().getTimezoneOffset()*6e4),today=now.toISOString().slice(0,10),cm=today.slice(0,7);
const $=n=>(n<0?'-':'')+'S$'+Math.round(Math.abs(n)).toLocaleString('en-SG'),P=n=>(isFinite(n)?n.toFixed(1):'0.0')+'%',esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=i=>{let x=Math.sin(i*97.3)*1e4;return x-Math.floor(x)};
function seed(){const d=now.getDate(),s={set:{name:'My Restaurant',gst:9,sc:10,cpf:17,sdl:0.25,levy:300,rent:9000,other:4500,tf:30,tb:25,tl:30,tr:10,tn:15},sup:[],price:[],inv:[],sales:[],staff:[],stock:[],waste:[],dish:[],omaL:[],oma:{name:'Omakase Kaiseki 10-course',price:168}};
let u=1;const id=()=>'i'+u++;
[['Tokyo Fresh Imports','Seafood','Net 14'],['Sea Harvest SG','Seafood','Net 7'],['Greenleaf Produce','Vegetables','COD'],['Vintage Cellars','Beverage','Net 30']].forEach(a=>s.sup.push({id:id(),name:a[0],cat:a[1],terms:a[2],contact:'+65 6000 000'+u}));
[['Hokkaido scallop','Tokyo Fresh Imports','kg',98],['Hokkaido scallop','Sea Harvest SG','kg',104],['Bluefin otoro','Tokyo Fresh Imports','kg',420],['Uni (sea urchin)','Tokyo Fresh Imports','kg',520],['Wagyu A5','Sea Harvest SG','kg',260],['Sushi rice','Greenleaf Produce','kg',6.5],['Yuzu','Greenleaf Produce','kg',24],['Sake junmai','Vintage Cellars','bottle',38]].forEach(a=>s.price.push({id:id(),item:a[0],sup:a[1],unit:a[2],price:a[3],date:today}));
for(let i=1;i<=d;i++){const dt=cm+'-'+pad(i),w=new Date(dt).getDay(),m=(w==5||w==6)?1.4:1,f=Math.round((1800+R(i)*900)*m),b=Math.round((500+R(i+50)*300)*m);s.sales.push({id:id(),date:dt,food:f,bev:b,covers:Math.round(f/62)});
if(i%2)s.inv.push({id:id(),date:dt,sup:s.sup[i%2].name,no:'INV-'+(1000+i),amt:Math.round(1300+R(i+9)*700),cat:'Food'});if(i%4==0)s.inv.push({id:id(),date:dt,sup:'Vintage Cellars',no:'VC-'+(200+i),amt:Math.round(500+R(i+3)*300),cat:'Beverage'})}
[['Head Chef','SG/PR',5200],['Sous Chef','SG/PR',3800],['Commis','Work pass',2400],['Commis','Work pass',2400],['Service Captain','SG/PR',3200],['Server','SG/PR',2400],['Server','Work pass',2000],['Dishwasher','Work pass',1800]].forEach(a=>s.staff.push({id:id(),name:a[0],type:a[1],sal:a[2]}));
[['Hokkaido scallop','kg',6,5,98],['Bluefin otoro','kg',3,4,420],['Sushi rice','kg',40,25,6.5],['Sake junmai','bottle',20,12,38]].forEach(a=>s.stock.push({id:id(),item:a[0],unit:a[1],qty:a[2],par:a[3],cost:a[4]}));
s.waste.push({id:id(),date:today,item:'Hokkaido scallop',qty:0.4,reason:'Over-prep'});
[['Otoro nigiri set',58,21,40],['Scallop carpaccio',24,7,90],['Wagyu don',48,22,60],['Chawanmushi',14,3.2,110],['Yuzu sorbet',10,1.8,70],['Uni toast',32,17,35]].forEach(a=>s.dish.push({id:id(),name:a[0],price:a[1],cost:a[2],sold:a[3]}));
[['Zensai (starter)','manual',0,6],['Scallop sashimi','Hokkaido scallop',0.06,0],['Otoro nigiri x2','Bluefin otoro',0.05,0],['Uni course','Uni (sea urchin)',0.03,0],['Wagyu','Wagyu A5',0.08,0],['Rice','Sushi rice',0.08,0],['Dessert','manual',0,4.5]].forEach(a=>s.omaL.push({id:id(),name:a[0],item:a[1],qty:a[2],manual:a[3]}));
return s}
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S)S=seed();M=cm;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}clearTimeout(saveT);saveT=setTimeout(()=>{try{DB&&DB.set({json:JSON.stringify(S)}).catch(()=>{})}catch(e){}},800)};function clearD(){['sup','price','inv','sales','staff','stock','waste','dish','omaL'].forEach(k=>S[k]=[]);save();go('set')}
const minP=n=>{const a=S.price.filter(p=>p.item==n).map(p=>+p.price);return a.length?Math.min(...a):0};
const lc=l=>l.item&&l.item!='manual'?(+l.qty||0)*minP(l.item):(+l.manual||0);
const stf=s=>+s.sal*(s.type=='SG/PR'?1+S.set.cpf/100:1)+(s.type=='SG/PR'?+s.sal*S.set.sdl/100:+S.set.levy);
function C(m){const st=S.set,dim=new Date(m.slice(0,4),+m.slice(5),0).getDate(),el=m==cm?now.getDate():dim,f=el/dim;
const sl=S.sales.filter(x=>x.date.startsWith(m)),fs=sum(sl,'food'),bs=sum(sl,'bev'),rev=fs+bs,iv=S.inv.filter(x=>x.date.startsWith(m)),
cf=sum(iv.filter(x=>x.cat=='Food'),'amt'),cb=sum(iv.filter(x=>x.cat=='Beverage'),'amt'),ox=sum(iv.filter(x=>x.cat!='Food'&&x.cat!='Beverage'),'amt'),
lab=S.staff.reduce((a,s)=>a+stf(s),0)*f,rent=st.rent*f,oth=st.other*f+ox,wc=S.waste.filter(w=>w.date.startsWith(m)).reduce((a,w)=>a+w.qty*((S.stock.find(i=>i.item==w.item)||{}).cost||0),0),
net=rev-cf-cb-lab-rent-oth;return{sl,fs,bs,rev,cf,cb,lab,rent,oth,wc,net,cov:sum(sl,'covers'),el,dim,fp:cf/fs*100,bp:cb/bs*100,lp:lab/rev*100,rp:rent/rev*100,np:net/rev*100}}
function sum(a,k){return a.reduce((x,y)=>x+(+y[k]||0),0)}
const col=(v,t,hi)=>(hi?v>=t:v<=t)?'ok':'bad';
/* generic table + add form */
function inp(k,f){const id=`i_${k}_${f.k}`;if(f.o){const o=typeof f.o=='function'?f.o():f.o;return`<select id="${id}">${o.map(x=>`<option>${esc(x)}</option>`).join('')}</select>`}
return`<input id="${id}" type="${f.t||'text'}" ${f.t=='number'?'step="any"':''} value="${f.t=='date'?today:''}">`}
function crud(k,F,rows){let a=rows?rows(S[k]):S[k];const q=(Q[k]||'').trim().toLowerCase();if(q)a=a.filter(r=>F.filter(f=>!f.calc).map(f=>r[f.k]).join(' ').toLowerCase().includes(q));let h='<div class="card"><label>Search<input id="q_'+k+'" type="search" placeholder="Type to filter" value="'+esc(Q[k]||'')+'" oninput="sq(\''+k+'\',this.value)"></label></div><div class="card"><div class="sc"><table><tr>'+F.map(f=>`<th class="${f.t=='number'||f.calc?'n':''}">${f.l}</th>`).join('')+'<th></th></tr>';
a.forEach(r=>h+='<tr>'+F.map(f=>`<td class="${f.t=='number'||f.calc?'n':''}">${f.calc?f.calc(r):esc(r[f.k]??'')}</td>`).join('')+`<td><button class="x" aria-label="Delete" onclick="del('${k}','${r.id}')">✕</button></td></tr>`);
if(!a.length)h+='<tr><td colspan="9" class="mu">No entries found. Clear the search or add one below.</td></tr>';
return h+`</table></div></div><div class="card"><b>Add entry</b><div class="fg">${F.filter(f=>!f.calc).map(f=>`<label>${f.l}${inp(k,f)}</label>`).join('')}</div><button onclick="add('${k}')">Add entry</button></div>`}
const FD={};function sq(k,v){Q[k]=v;go(T);const e=document.getElementById('q_'+k);e.focus();e.setSelectionRange(e.value.length,e.value.length)}
function add(k){const o={id:'i'+Date.now()};FD[k].filter(f=>!f.calc).forEach(f=>{let v=document.getElementById(`i_${k}_${f.k}`).value;o[f.k]=f.t=='number'?(parseFloat(v)||0):v});if(k=='sales'&&SM=='gross'){const d=(1+S.set.sc/100)*(1+S.set.gst/100);o.food=Math.round(o.food/d*100)/100;o.bev=Math.round(o.bev/d*100)/100}if(!o[FD[k].find(f=>!f.calc).k])return;S[k].push(o);save();go(T)}
function del(k,i){S[k]=S[k].filter(r=>r.id!=i);save();go(T)}
const def=(k,F)=>{FD[k]=F;return F};
const bydate=a=>a.slice().sort((x,y)=>y.date.localeCompare(x.date));
const kp=(l,v,c='')=>`<div class="k"><span>${l}</span><b class="${c}">${v}</b></div>`;
const row=(l,v,t,c)=>`<tr class="${c||''}"><td>${l}</td><td class="n">${$(v)}</td><td class="n">${t==null?'':P(v/CX.rev*100)}</td></tr>`;
let CX;
const V={
dash(){const c=CX,s=S.set,mx=Math.max(1,...c.sl.map(x=>x.food+x.bev)),w=Math.max(300,c.sl.length*18);
let h=`<div class="kp">${kp('Net sales',$(c.rev))}${kp('Net profit '+P(c.np),$(c.net),c.np>=s.tn?'ok':'bad')}${kp('Covers / avg spend',c.cov+' / '+$(c.rev/(c.cov||1)))}${kp('Waste logged',$(c.wc),c.wc>0?'warn':'')}</div>
<div class="card"><h2>Actual vs target (% of sales)</h2><div class="sc"><table><tr><th>Line</th><th class="n">Actual</th><th class="n">Target</th></tr>
<tr><td>Food cost</td><td class="n ${col(c.fp,s.tf)}">${P(c.fp)}</td><td class="n">${s.tf}%</td></tr><tr><td>Beverage cost</td><td class="n ${col(c.bp,s.tb)}">${P(c.bp)}</td><td class="n">${s.tb}%</td></tr>
<tr><td>Labour</td><td class="n ${col(c.lp,s.tl)}">${P(c.lp)}</td><td class="n">${s.tl}%</td></tr><tr><td>Rent</td><td class="n ${col(c.rp,s.tr)}">${P(c.rp)}</td><td class="n">${s.tr}%</td></tr><tr><td>Net profit</td><td class="n ${col(c.np,s.tn,1)}">${P(c.np)}</td><td class="n">${s.tn}%</td></tr></table></div></div>
<div class="card"><h2>Daily sales</h2><div class="sc"><svg width="${w}" height="120" role="img" aria-label="Daily sales bars">${c.sl.map((x,i)=>{const hh=(x.food+x.bev)/mx*100;return`<rect x="${i*18+2}" y="${110-hh}" width="13" height="${hh}" rx="2" fill="var(--ac)"><title>${x.date}: ${$(x.food+x.bev)}</title></rect>`}).join('')}</svg></div></div>
<div class="card"><h2>Profit and loss, ${M}</h2><div class="sc"><table><tr><th></th><th class="n">S$</th><th class="n">% sales</th></tr>${row('Food sales',c.fs)}${row('Beverage sales',c.bs)}${row('Net revenue',c.rev,1,'t')}${row('Food cost',-c.cf,1)}${row('Beverage cost',-c.cb,1)}${row('Gross profit',c.rev-c.cf-c.cb,1,'t')}${row('Labour (incl. CPF, levy)',-c.lab,1)}${row('Rent',-c.rent,1)}${row('Other opex',-c.oth,1)}${row('Net profit',c.net,1,'t')}</table></div><p class="mu">Rent and fixed costs are prorated for ${c.el} of ${c.dim} days.</p></div>`;return h},
set(){const s=S.set,F=[['name','Restaurant name'],['gst','GST %'],['sc','Service charge %'],['cpf','Employer CPF % (SG/PR)'],['sdl','SDL %'],['levy','Foreign worker levy S$/month'],['rent','Monthly rent S$'],['other','Other fixed S$/month'],['tf','Target food cost %'],['tb','Target beverage cost %'],['tl','Target labour %'],['tr','Target rent %'],['tn','Target net profit %']];
return`<div class="card"><h2>Settings and targets</h2><div class="fg">${F.map(f=>`<label>${f[1]}<input ${f[0]=='name'?'':'type="number" step="any"'} value="${esc(s[f[0]])}" onchange="S.set['${f[0]}']=${f[0]=='name'?'this.value':'parseFloat(this.value)||0'};save();if('${f[0]}'=='name')hd()"></label>`).join('')}</div><p class="mu">Enter sales excluding GST and service charge. Targets are % of net sales.</p><button class="p" onclick="if(this.dataset.c){clearD()}else{this.dataset.c=1;this.textContent='Tap again to delete all entries'}">Clear sample data</button></div>`},
inv(){const t=CX.cf+CX.cb+CX.oth;return`<div class="kp">${kp('Invoices this month',$(t))}${kp('Count',S.inv.filter(x=>x.date.startsWith(M)).length)}</div>`+crud('inv',def('inv',[{k:'date',l:'Date',t:'date'},{k:'sup',l:'Supplier',o:()=>S.sup.map(x=>x.name)},{k:'no',l:'Invoice no.'},{k:'amt',l:'Amount S$',t:'number'},{k:'cat',l:'Category',o:['Food','Beverage','Packaging','Other opex']}]),bydate)},
sup(){return crud('sup',def('sup',[{k:'name',l:'Supplier'},{k:'cat',l:'Category'},{k:'terms',l:'Terms'},{k:'contact',l:'Contact'}]))},
price(){return crud('price',def('price',[{k:'item',l:'Item'},{k:'sup',l:'Supplier',o:()=>S.sup.map(x=>x.name)},{k:'unit',l:'Unit'},{k:'price',l:'Price S$',t:'number'},{k:'date',l:'Updated',t:'date'},{l:'Best?',calc:r=>+r.price==minP(r.item)&&S.price.filter(p=>p.item==r.item).length>1?'<span class="tag">lowest</span>':''}]))},
oma(){const o=S.oma,cost=S.omaL.reduce((a,l)=>a+lc(l),0),fp=cost/o.price*100,sug=cost/(S.set.tf/100);
return`<div class="card"><h2>Course costing</h2><div class="fg"><label>Course name<input value="${esc(o.name)}" onchange="S.oma.name=this.value;save()"></label><label>Price per guest S$ (net)<input type="number" value="${o.price}" onchange="S.oma.price=parseFloat(this.value)||0;save();go('oma')"></label></div>
<div class="kp">${kp('Cost per guest',$(cost))}${kp('Food cost %',P(fp),col(fp,S.set.tf))}${kp('Margin per guest',$(o.price-cost))}${kp('Price at target',$(sug))}</div><p class="mu">With service charge and GST the guest pays ${$(o.price*(1+S.set.sc/100)*(1+S.set.gst/100))}. Ingredient costs use the lowest supplier price.</p><button onclick="S.dish.push({id:'i'+Date.now(),name:S.oma.name,price:S.oma.price,cost:${cost.toFixed(2)},sold:0});save();go('menu')">Add to menu P&amp;L</button></div>`+
crud('omaL',def('omaL',[{k:'name',l:'Course item'},{k:'item',l:'Ingredient',o:()=>['manual',...new Set(S.price.map(p=>p.item))]},{k:'qty',l:'Qty (price unit)',t:'number'},{k:'manual',l:'Manual cost S$',t:'number'},{l:'Cost',calc:r=>$(lc(r)).replace('S$','S$')+'' }]))},
menu(){const a=S.dish,ts=sum(a,'sold')||1,tc=a.reduce((x,d)=>x+(d.price-d.cost)*d.sold,0),avg=tc/ts;
const cls=d=>{const pop=d.sold>=0.7*ts/a.length,hi=d.price-d.cost>=avg;return pop&&hi?'Star':pop?'Plowhorse':hi?'Puzzle':'Dog'};
const rev=a.reduce((x,d)=>x+d.price*d.sold,0),cs=a.reduce((x,d)=>x+d.cost*d.sold,0);
return`<div class="kp">${kp('Menu revenue (net)',$(rev))}${kp('Menu food cost',P(cs/(rev||1)*100),col(cs/(rev||1)*100,S.set.tf))}${kp('Contribution',$(rev-cs))}${kp('Avg margin/dish',$(avg))}</div>`+
crud('dish',def('dish',[{k:'name',l:'Dish'},{k:'price',l:'Price S$',t:'number'},{k:'cost',l:'Cost S$',t:'number'},{k:'sold',l:'Sold / month',t:'number'},{l:'Cost %',calc:d=>`<span class="${col(d.cost/d.price*100,S.set.tf)}">${P(d.cost/d.price*100)}</span>`},{l:'Contribution',calc:d=>$((d.price-d.cost)*d.sold)},{l:'Class',calc:cls}]))+'<p class="mu">Star: popular and profitable. Plowhorse: popular, low margin, so reprice or trim cost. Puzzle: profitable, so promote. Dog: consider removing.</p>'},
sales(){return`<div class="kp">${kp('Net sales',$(CX.rev))}${kp('Service charge',$(CX.rev*S.set.sc/100))}${kp('GST',$(CX.rev*(1+S.set.sc/100)*S.set.gst/100))}${kp('Gross collected',$(CX.rev*(1+S.set.sc/100)*(1+S.set.gst/100)))}${kp('Avg per day (net)',$(CX.rev/CX.el))}${kp('Food / Bev split',P(CX.fs/(CX.rev||1)*100)+' / '+P(CX.bs/(CX.rev||1)*100))}</div><div class="card"><label>Enter the food and beverage amounts below as<select onchange="SM=this.value"><option value="net" ${SM=='net'?'selected':''}>Net (before service charge and GST)</option><option value="gross" ${SM=='gross'?'selected':''}>Gross (POS total incl. service charge and GST)</option></select></label></div>`+crud('sales',def('sales',[{k:'date',l:'Date',t:'date'},{k:'food',l:'Food S$',t:'number'},{k:'bev',l:'Beverage S$',t:'number'},{k:'covers',l:'Covers',t:'number'},{l:'Net sales',calc:r=>$(r.food+r.bev)},{l:'Service charge',calc:r=>$((r.food+r.bev)*S.set.sc/100)},{l:'GST',calc:r=>$((r.food+r.bev)*(1+S.set.sc/100)*S.set.gst/100)},{l:'Gross total',calc:r=>`<b>${$((r.food+r.bev)*(1+S.set.sc/100)*(1+S.set.gst/100))}</b>`}]),bydate)+`<p class="mu">Gross entries are converted back to net and saved as net, so the P&amp;L stays correct. Service charge (${S.set.sc}%) is added first, then GST (${S.set.gst}%) on top of both. Change rates in Settings.</p>`},
